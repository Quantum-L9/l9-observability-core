# Fast pull-request lane for Quantum-L9/l9-observability-core.
#
# The organization's required workflow judges pull-request test expense: a
# full-suite selection is refused on a judged event. This repository had no
# pull-request workflow at all after l9-nightly.yml was retired, so the judge
# saw no selection and returned ZERO_TESTS.
#
# The fast lane runs lint, format and the contract-shape suites (canonical
# forms, JSON Schemas, model integrity, registry). The whole tree runs in
# .github/workflows/deep-plan.yml, which Core dispatches on a changed night.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Lint and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --only-binary ':all:' "uv==0.12.10"
      - name: Sync the locked environment
        run: uv sync --locked --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: Fast suite
        run: >-
          uv run pytest
          tests/test_canonical.py
          tests/test_json_schemas.py
          tests/test_model_integrity.py
          tests/test_registry.py
